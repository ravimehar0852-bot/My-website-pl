<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTS Cabs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #000; }

  .container { max-width: 480px; margin: 0 auto; background: #000; min-height: 100vh; }

  /* Header */
  .header {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 3px solid #f4b400;
  }
  .logo { display: flex; align-items: center; }
  .logo svg { width: 70px; height: 45px; }
  .logo-text { margin-left: -4px; }
  .logo-text .kts { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
  .logo-text .cabs {
    font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
    background: #000; color: #f4b400; padding: 0 4px;
  }
  .phone-btn {
    background: #f4b400;
    border-radius: 30px;
    padding: 12px 20px;
    font-weight: 700;
    font-size: 15px;
    color: #000;
    white-space: nowrap;
  }
  .menu-icon { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
  .menu-icon span { width: 28px; height: 3px; background: #000; border-radius: 2px; }

  /* Tabs: Outstation / Local */
  .tabs {
    display: flex;
    gap: 36px;
    padding: 22px 20px 14px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding-bottom: 10px;
  }
  .tab.active { border-bottom: 3px solid #f4b400; }
  .tab svg { width: 22px; height: 22px; }

  /* One Way / Round Trip toggle */
  .toggle-row {
    display: flex;
    gap: 12px;
    padding: 6px 20px 18px;
  }
  .toggle-btn {
    flex: 1;
    text-align: center;
    padding: 16px 0;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
  }
  .toggle-btn.active { background: #f4b400; color: #000; }
  .toggle-btn.inactive { background: #fff; color: #000; }

  /* Form fields */
  .form { padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
  .field {
    background: #fff;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 14px;
  }
  .field svg { width: 18px; height: 18px; flex-shrink: 0; }
  .field input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 15px;
    color: #6b6b6b;
    background: transparent;
  }
  .field input::placeholder { color: #8a8a8a; }

  .search-btn-wrap { padding: 24px 20px 40px; }
  .search-btn {
    width: 60%;
    background: #f4b400;
    border: none;
    border-radius: 30px;
    padding: 18px 0;
    font-weight: 700;
    font-size: 16px;
    color: #000;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 100 60" fill="none">
        <path d="M5 45 Q5 30 20 28 Q28 10 50 10 Q72 10 80 28 Q95 30 95 45 L95 50 L5 50 Z" fill="#000"/>
        <rect x="0" y="45" width="100" height="8" fill="#f4b400"/>
        <path d="M25 30 Q35 18 50 18 Q65 18 75 30 Z" fill="#f4b400"/>
        <circle cx="20" cy="52" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
        <circle cx="80" cy="52" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
      </svg>
      <div class="logo-text">
        <span class="kts">KTS</span> <span class="cabs">CABS</span>
      </div>
    </div>
    <div class="phone-btn">+91-8737993690</div>
    <div class="menu-icon">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M4 21V3h8v4h8v14h-6v-4h-4v4H4zm2-2h2v-2H6v2zm0-4h2v-2H6v2zm0-4h2V9H6v2zm0-4h2V5H6v2zm4 12h2v-2h-2v2zm0-4h2v-2h-2v2zm0-4h2V9h-2v2zm6 8h2v-2h-2v2zm0-4h2v-2h-2v2z"/></svg>
      Outstation
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
      Local
    </div>
  </div>

  <!-- One Way / Round Trip -->
  <div class="toggle-row">
    <div class="toggle-btn active">One Way</div>
    <div class="toggle-btn inactive">Round Trip</div>
  </div>

  <!-- Form -->
  <div class="form">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="#1a56db"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <input type="text" placeholder="From City">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="#1a56db"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <input type="text" placeholder="To City">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="#1a56db"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg>
      <input type="text" value="28-07-2026">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="#1a56db"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      <input type="text" value="04:03 AM">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="#1a56db"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14z"/></svg>
      <input type="text" placeholder="Mobile No">
    </div>
  </div>

  <!-- Search Cab Button -->
  <div class="search-btn-wrap">
    <button class="search-btn">Search Cab</button>
  </div>

</div>
</body>
</html>
